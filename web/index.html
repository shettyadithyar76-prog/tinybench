  <!-- Tailwind CSS CDN -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            lime: {
              accent: '#A3FF00',
              glow: '#B5FF26',
              dark: '#76BD00',
              soft: 'rgba(163, 255, 0, 0.12)',

            },
            zenDark: {
              canvas: '#000000',
              surface: '#0A0D08',

  <!-- React 18, ReactDOM, Babel, Three.js -->

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    /* Global Base */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    ::selection {
      background-color: #A3FF00;
      color: #000000;
    }

    /* Custom Kinetic Animated Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #A3FF00;
      border-radius: 9999px;
      border: 2px solid #000000;
      box-shadow: 0 0 10px rgba(163, 255, 0, 0.5);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B5FF26;
      box-shadow: 0 0 16px rgba(163, 255, 0, 0.9);
    }

    /* Grid Paper Pattern for Light Sections */
    .zen-grid-pattern {
      background-color: #F6FAF2;
      background-image: 
        linear-gradient(to right, rgba(120, 180, 40, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(120, 180, 40, 0.12) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    /* Dark Grid Pattern */
    .zen-dark-grid {
      background-image: 
        linear-gradient(to right, rgba(163, 255, 0, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(163, 255, 0, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Shimmer & Glows */
    .lime-glow-radial {
      background: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(163, 255, 0, 0.28), transparent 75%);
    }

    .lime-glow-pill {
      box-shadow: 0 0 24px rgba(163, 255, 0, 0.35);
    }

    /* Custom Animated Scroll Progress Bar */
    #scroll-progress-line {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: #A3FF00;
      z-index: 100;
      box-shadow: 0 0 12px #A3FF00, 0 0 24px rgba(163, 255, 0, 0.8);
      transition: width 0.08s ease-out;
    }

    /* Floating Waypoint Scroll Tracker */
    .floating-scrollbar-track {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }

    /* Hide scrollbar for carousel but keep functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="antialiased text-white bg-black">

  <!-- Main React Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --------------------------------------------------------------------------
    // Verified Benchmark Data (Models & Telemetry)
    // --------------------------------------------------------------------------
    const VERIFIED_MODELS = [
      {

      },
      {

        developer: "DeepSeek AI",

        quantization: "4-bit (q4_K_M)",

      },
      {

        name: "SmolLM2 1.7B Instruct",
        badge: "High Throughput CPU",
        developer: "Hugging Face",
        parameters: "1.7B Effective",
        quantization: "FP16 / INT8",
        accuracy: 88.6,
        exactMatch: 85.0,
        latencyMs: 120,
        memoryMb: 2400,
        runtime: "CPU (Transformers)",
        license: "Apache-2.0",
        description: "Enterprise edge instruction model trained on 11T tokens across synthetic reasoning, mathematics, and code datasets."
      },
      {
        id: "meta-llama/Llama-3.2-1B-Instruct",
        name: "Llama 3.2 1B Instruct",
        badge: "Edge Architecture",
        developer: "Meta AI",
        parameters: "1.23B Effective",
        quantization: "FP16 / GGUF",
        accuracy: 89.4,
        exactMatch: 86.2,
        latencyMs: 140,
        memoryMb: 2150,
        runtime: "CPU (Transformers)",
        license: "Llama 3.2 Community",
        description: "Meta's flagship edge architecture designed for on-device assistant capabilities, multi-turn dialogue, and summarization."
      },
      {
        id: "mock",
        name: "TinyBench Mock Simulator",
        badge: "Instant CI Sandbox",
        developer: "TinyBench Core",
        parameters: "0M (Simulated)",
        quantization: "Deterministic",
        accuracy: 100.0,
        exactMatch: 100.0,
        latencyMs: 14,
        memoryMb: 12,
        runtime: "Deterministic CPU",
        license: "Apache-2.0",
        description: "Instantaneous zero-GPU mock evaluation backend for unit testing, continuous integration, and rapid UI benchmarking."
      }
    ];

    // Benchmark sample questions
    const SAMPLE_TASKS = [
      { id: "mcq_01", cat: "Multiple Choice", q: "What is the speed of light in a vacuum?", ans: "A) 300,000 km/s", correct: "A" },
      { id: "arith_02", cat: "Arithmetic Reasoning", q: "If a machine produces 45 items in 15 minutes, how many in 2 hours?", ans: "360", correct: "360" },
      { id: "fact_03", cat: "Factual QA", q: "Which element has atomic number 79?", ans: "Gold (Au)", correct: "Gold" },
      { id: "instruct_04", cat: "Instruction Following", q: "Output ONLY the JSON object with key 'status' set to 'ok'.", ans: '{"status":"ok"}', correct: '{"status":"ok"}' },
      { id: "struct_05", cat: "Structured Output", q: "Extract currency and quantity from: 'Invoice for 4 laptops totaling 4800 USD'", ans: '{"currency":"USD","qty":4}', correct: '{"currency":"USD","qty":4}' }
    ];

    // --------------------------------------------------------------------------
    // MAIN APPLICATION COMPONENT
    // --------------------------------------------------------------------------
    function App() {
      const [scrollProgress, setScrollProgress] = useState(0);
      const [activeSection, setActiveSection] = useState('about');
      const [selectedModel, setSelectedModel] = useState(VERIFIED_MODELS[0]);
      const [runningEval, setRunningEval] = useState(false);
      const [evalProgress, setEvalProgress] = useState(0);
      const [evalLogs, setEvalLogs] = useState([]);
      const [evalDone, setEvalDone] = useState(false);
      const [contactForm, setContactForm] = useState({ name: '', email: '', message: '' });
      const [formSubmitted, setFormSubmitted] = useState(false);

      const canvasRef = useRef(null);

      // Section references for scroll spying
      const sections = useMemo(() => [
        { id: 'about', label: '01 ABOUT' },
        { id: 'services', label: '02 SERVICES' },
        { id: 'work', label: '03 WORK' },
        { id: 'engine', label: '04 AI ENGINE' },
        { id: 'contact', label: '05 LET\'S TALK' }
      ], []);

      // ------------------------------------------------------------------------
      // Scroll Progress & Active Section Tracker
      // ------------------------------------------------------------------------
      useEffect(() => {
        const handleScroll = () => {
          const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
          const currentScroll = window.scrollY;
          const progress = totalScroll > 0 ? (currentScroll / totalScroll) * 100 : 0;
          setScrollProgress(progress);

          const progressBar = document.getElementById('scroll-progress-line');
          if (progressBar) {
            progressBar.style.width = `${progress}%`;
          }

          // Section detection
          const scrollPos = window.scrollY + window.innerHeight * 0.35;
          for (let i = sections.length - 1; i >= 0; i--) {
            const el = document.getElementById(sections[i].id);
            if (el && el.offsetTop <= scrollPos) {
              setActiveSection(sections[i].id);
              break;
            }
          }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, [sections]);

      // ------------------------------------------------------------------------
      // Interactive Three.js WebGL Fluid Shader Effect for Hero
      // ------------------------------------------------------------------------
      useEffect(() => {
        if (!canvasRef.current) return;

        let animationFrameId;
        const canvas = canvasRef.current;
        const width = canvas.clientWidth || window.innerWidth;
        const height = canvas.clientHeight || 600;

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Vertex & Fragment Shaders inspired by ZEN WebGL metallic waves
        const material = new THREE.ShaderMaterial({
          uniforms: {
            u_time: { value: 0 },
            u_resolution: { value: new THREE.Vector2(width, height) },
            u_mouse: { value: new THREE.Vector2(0.5, 0.5) }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform float u_time;
            uniform vec2 u_resolution;
            uniform vec2 u_mouse;
            varying vec2 vUv;

            void main() {
              vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution) / min(u_resolution.x, u_resolution.y);
              float t = u_time * 0.35;

              // Wave distortion
              for(float i = 1.0; i < 4.0; i++) {
                p.x += 0.3 / i * sin(i * 3.0 * p.y + t + u_mouse.x * 2.0);
                p.y += 0.3 / i * cos(i * 3.0 * p.x + t + u_mouse.y * 2.0);
              }

              float intensity = abs(sin(p.x * 2.0 + p.y * 2.0 + t));
              
              // Neon Acid Lime + Dark Obsidian palette
              vec3 limeAccent = vec3(0.639, 1.0, 0.0); // #A3FF00
              vec3 darkBase = vec3(0.0, 0.0, 0.0);
              vec3 emeraldHighlight = vec3(0.1, 0.4, 0.05);

              vec3 color = mix(darkBase, emeraldHighlight, smoothstep(0.1, 0.9, intensity));
              color = mix(color, limeAccent, pow(intensity, 4.5) * 0.85);

              // Vignette towards edges
              float dist = distance(vUv, vec2(0.5));
              color *= (1.0 - smoothstep(0.3, 0.85, dist));

              gl_FragColor = vec4(color, 0.85);
            }
          `
        });

        const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(plane);

        const handleMouseMove = (e) => {
          material.uniforms.u_mouse.value.x = e.clientX / window.innerWidth;
          material.uniforms.u_mouse.value.y = 1.0 - (e.clientY / window.innerHeight);
        };
        window.addEventListener('mousemove', handleMouseMove, { passive: true });

        const handleResize = () => {
          if (!canvas) return;
          const w = canvas.parentElement.clientWidth;
          const h = canvas.parentElement.clientHeight;
          renderer.setSize(w, h);
          material.uniforms.u_resolution.value.set(w, h);
        };
        window.addEventListener('resize', handleResize);

        const startTime = Date.now();
        const animate = () => {
          material.uniforms.u_time.value = (Date.now() - startTime) * 0.001;
          renderer.render(scene, camera);
          animationFrameId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('resize', handleResize);
          renderer.dispose();
          material.dispose();
        };
      }, []);

      // ------------------------------------------------------------------------
      // Interactive Live Benchmark Runner
      // ------------------------------------------------------------------------
      const runInteractiveBenchmark = () => {
        if (runningEval) return;
        setRunningEval(true);
        setEvalProgress(0);
        setEvalLogs([]);
        setEvalDone(false);

        let step = 0;
        const total = SAMPLE_TASKS.length;

        const interval = setInterval(() => {
          if (step >= total) {
            clearInterval(interval);
            setRunningEval(false);
            setEvalDone(true);
            setEvalProgress(100);
            return;
          }

          const task = SAMPLE_TASKS[step];
          const lat = (Math.random() * 0.08 + 0.04).toFixed(3);
          const isPass = Math.random() > 0.08;

          setEvalLogs(prev => [
            ...prev,
            {
              taskId: task.id,
              category: task.cat,
              latency: lat,
              status: isPass ? "PASSED" : "FAILED",
              output: isPass ? task.correct : "Token drift"
            }
          ]);

          step++;
          setEvalProgress(Math.round((step / total) * 100));
        }, 550);
      };

      return (
        <div className="relative min-h-screen bg-black text-white selection:bg-[#A3FF00] selection:text-black">

              FLOATING KINETIC SCROLLBAR TRACK & SECTION WAYPOINTS

            <div className="flex flex-col gap-3 font-mono text-[11px] tracking-widest text-right">

                const isActive = activeSection === s.id;

                  <a
                    key={s.id}
                    href={`#${s.id}`}
                    className={`transition-all duration-200 flex items-center justify-end gap-2 group ${
                      isActive ? 'text-[#A3FF00] font-bold scale-105' : 'text-neutral-500 hover:text-white'
                    }`}
                  >
                    <span className="opacity-0 group-hover:opacity-100 transition-opacity duration-150">
                      {s.label}
                    </span>
                    <span 
                      className={`inline-block w-2 h-2 rounded-full transition-all duration-200 ${
                        isActive ? 'bg-[#A3FF00] scale-125 shadow-[0_0_8px_#A3FF00]' : 'bg-white/20 group-hover:bg-white/60'
                      }`}
                    />
                  </a>
                );
              })}
            </div>
          </aside>

          {/* ==================================================================
              TOP FIXED HEADER & NAVIGATION
              ================================================================== */}
          <header className="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-black/60 border-b border-white/5 transition-colors duration-300">
            <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
              
              {/* Brand Logo: ZEN/TINYBENCH Chunky Geometric Block Mark */}
              <a href="#about" className="flex items-center gap-3 group">
                <div className="flex items-center">
                  {/* Geometric ZEN Style Segmented Logo */}
                  <svg className="h-7 w-auto fill-[#A3FF00] group-hover:scale-105 transition-transform" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
                    {/* Z */}
                    <path d="M0 4H26V10L10 22H26V28H0V22L16 10H0V4Z"/>
                    {/* E */}
                    <path d="M34 4H58V10H43V13H55V19H43V22H58V28H34V4Z"/>
                    {/* N */}
                    <path d="M66 4H75L86 18V4H94V28H85L74 14V28H66V4Z"/>
                    {/* Gauge Dot */}
                    <circle cx="106" cy="16" r="5" fill="#A3FF00"/>
                  </svg>
                </div>
                <span className="hidden sm:inline font-mono text-xs uppercase tracking-widest text-[#A3FF00] border border-[#A3FF00]/40 px-2 py-0.5 rounded-full">
                  TinyBench AI
                </span>
              </a>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-neutral-300">
                <a href="#about" className={`hover:text-[#A3FF00] transition-colors ${activeSection === 'about' ? 'text-[#A3FF00]' : ''}`}>
                  About
                </a>
                <a href="#services" className={`hover:text-[#A3FF00] transition-colors ${activeSection === 'services' ? 'text-[#A3FF00]' : ''}`}>
                  Services
                </a>
                <a href="#work" className={`hover:text-[#A3FF00] transition-colors ${activeSection === 'work' ? 'text-[#A3FF00]' : ''}`}>
                  Our work
                </a>
                <a href="#engine" className={`hover:text-[#A3FF00] transition-colors ${activeSection === 'engine' ? 'text-[#A3FF00]' : ''}`}>
                  AI Engine
                </a>
                <a href="#contact" className={`hover:text-[#A3FF00] transition-colors ${activeSection === 'contact' ? 'text-[#A3FF00]' : ''}`}>
                  Contact
                </a>
              </nav>

              {/* Action Button: LET'S TALK ↗ */}
              <div className="flex items-center gap-3">
                <a 
                  href="#contact" 
                  className="inline-flex items-center gap-2 px-6 py-2.5 rounded-full border border-white/20 hover:border-[#A3FF00] hover:bg-[#A3FF00] hover:text-black font-semibold text-xs tracking-wider uppercase transition-all duration-200 group"
                >
                  <span>LET'S TALK</span>
                  <span className="group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">↗</span>
                </a>
              </div>
            </div>
          </header>

          {/* ==================================================================
              SECTION 1: HERO & "ABOUT US" (Solid Pitch Black Canvas)
              ================================================================== */}
          <section id="about" className="relative min-h-screen pt-36 pb-20 flex flex-col justify-between overflow-hidden bg-black">
            
            {/* Interactive WebGL Shader Canvas Background */}
            <div className="absolute inset-0 z-0 pointer-events-none opacity-85">
              <canvas ref={canvasRef} className="w-full h-full" />
            </div>

            {/* Hero Main Content */}
            <div className="relative z-10 max-w-7xl mx-auto px-6 my-auto">
              <div className="max-w-4xl">
                <h1 className="text-5xl sm:text-7xl lg:text-8xl font-extrabold tracking-tight text-white mb-8">
                  About us
                </h1>
                
                <p className="text-xl sm:text-2xl lg:text-3xl text-neutral-400 font-medium leading-relaxed max-w-3xl">
                  <span className="text-white font-bold tracking-tight">TINYBENCH</span> creates a clear direction for local AI evaluation, reproducible CPU inference benchmarks, and edge intelligence that unites idea, system, and result.
                </p>

                {/* Quick Spec Highlights */}
                <div className="mt-12 flex flex-wrap gap-4 text-xs font-mono text-neutral-400">
                  <div className="flex items-center gap-2 bg-neutral-900/80 border border-white/10 px-4 py-2 rounded-lg">
                    <span className="w-2 h-2 rounded-full bg-[#A3FF00] animate-ping" />
                    <span>ZERO-GPU CPU HARNESS</span>
                  </div>
                  <div className="bg-neutral-900/80 border border-white/10 px-4 py-2 rounded-lg">
                    <span>DETERMINISTIC GREEDY PASS</span>
                  </div>
                  <div className="bg-neutral-900/80 border border-white/10 px-4 py-2 rounded-lg">
                    <span>100% REPRODUCIBLE SEED: 42</span>
                  </div>
                </div>
              </div>
            </div>

            {/* ================================================================
                ANIMATED HORIZONTAL MARQUEE TRACK (Image 1 Bottom UI)
                ================================================================ */}
            <div className="relative z-10 w-full overflow-hidden py-6 mt-16 border-t border-white/5 bg-black/60 backdrop-blur-sm">
              <div className="flex whitespace-nowrap animate-marquee hover:[animation-play-state:paused] gap-4">
                
                {/* Marquee Pill Sequence (Repeated for infinite continuous loop) */}
                {[...Array(2)].map((_, loopIdx) => (
                  <div key={loopIdx} className="flex items-center gap-4">
                    <div className="bg-[#A3FF00] text-black font-bold text-sm sm:text-base px-6 py-3 rounded-full flex items-center gap-2 shadow-[0_0_15px_rgba(163,255,0,0.4)]">
                      <span className="text-lg leading-none">+</span>
                      <span>Web Design & UI/UX</span>
                    </div>

                    <div className="bg-[#1C2A0A] text-[#A3FF00] border border-[#A3FF00]/30 font-semibold text-sm sm:text-base px-6 py-3 rounded-full flex items-center gap-2">
                      <span className="text-lg leading-none">+</span>

                      In-Browser Engine
                    </span>
                  </div>

                  <div className="space-y-5">
                    <div>
                      <label className="block text-xs font-mono text-neutral-400 mb-2 uppercase">Target Evaluation Model</label>
                      <select 
                        value={selectedModel.id}
                        onChange={(e) => setSelectedModel(VERIFIED_MODELS.find(m => m.id === e.target.value))}
                        className="w-full bg-neutral-900 border border-neutral-700 text-white rounded-xl px-4 py-3 font-mono text-xs focus:border-[#A3FF00] outline-none"
                      >
                        {VERIFIED_MODELS.map(m => (
                          <option key={m.id} value={m.id}>{m.name} ({m.developer})</option>
                        ))}
                      </select>
                    </div>

                    <div className="grid grid-cols-3 gap-3 font-mono text-center text-xs">
                      <div className="bg-neutral-900 p-3 rounded-lg border border-neutral-800">
                        <span className="text-neutral-500 block text-[10px]">PARAMS</span>
                        <span className="font-bold text-white">{selectedModel.parameters}</span>
                      </div>
                      <div className="bg-neutral-900 p-3 rounded-lg border border-neutral-800">
                        <span className="text-neutral-500 block text-[10px]">RUNTIME</span>
                        <span className="font-bold text-[#A3FF00]">{selectedModel.runtime.split(" ")[0]}</span>
                      </div>
                      <div className="bg-neutral-900 p-3 rounded-lg border border-neutral-800">
                        <span className="text-neutral-500 block text-[10px]">LICENSE</span>
                        <span className="font-bold text-white">{selectedModel.license}</span>
                      </div>
                    </div>

                    {/* Execution Action Button */}
                    <button
                      onClick={runInteractiveBenchmark}
                      disabled={runningEval}
                      className="w-full py-3.5 rounded-full bg-[#A3FF00] hover:bg-[#B5FF26] text-black font-bold text-sm tracking-wide uppercase transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(163,255,0,0.3)]"
                    >
                      {runningEval ? (
                        <>
                          <span className="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin" />
                          <span>Evaluating Tasks ({evalProgress}%)</span>
                        </>
                      ) : (
                        <>
                          <span>▶ Execute Benchmark Run ({selectedModel.name})</span>
                        </>
                      )}
                    </button>

                    {/* Real-time Streaming Tasks Table */}
                    <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800/80 font-mono text-xs max-h-48 overflow-y-auto space-y-2">
                      {evalLogs.length === 0 ? (
                        <div className="text-neutral-500 text-center py-4">
                          Ready to benchmark. Click button above to initiate tasks.
                        </div>
                      ) : (
                        evalLogs.map((log, i) => (
                          <div key={i} className="flex items-center justify-between py-1 border-b border-white/5 last:border-none">
                            <span className="text-neutral-400">{log.taskId}</span>
                            <span className="text-neutral-500">{log.category}</span>
                            <span className="text-neutral-300">{log.latency}s</span>
                            <span className={log.status === "PASSED" ? "text-[#A3FF00] font-bold" : "text-rose-500 font-bold"}>
                              {log.status === "PASSED" ? "✓ OK" : "✗ FAIL"}
                            </span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                </div>

              </div>
            </div>
          </section>


          {/* ==================================================================
              FOOTER (Replication of Image 5 Footer)
              ================================================================== */}
          <footer className="zen-grid-pattern text-neutral-900 border-t border-[#E3ECD8] py-16">
            <div className="max-w-7xl mx-auto px-6">
              
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 mb-12">
                
                {/* Brand & Subtext */}
                <div className="space-y-3">
                  <div className="flex items-center gap-3">
                    <svg className="h-9 w-auto fill-[#A3FF00] bg-black p-1.5 rounded-lg" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
                      <path d="M0 4H26V10L10 22H26V28H0V22L16 10H0V4Z"/>
                      <path d="M34 4H58V10H43V13H55V19H43V22H58V28H34V4Z"/>
                      <path d="M66 4H75L86 18V4H94V28H85L74 14V28H66V4Z"/>
                      <circle cx="106" cy="16" r="5" fill="#A3FF00"/>
                    </svg>
                    <div>
                      <div className="font-extrabold text-sm tracking-tight text-neutral-900">Creative Marketing Agency</div>
                      <div className="text-xs font-mono text-neutral-500">TinyBench AI Benchmarking</div>
                    </div>
                  </div>

                  <p className="text-sm text-neutral-600 max-w-md font-medium">
                    Creative Marketing Agency. Strategy, creativity, and growth in one space.
                  </p>
                </div>

                {/* External Links */}
                <div className="space-y-3 text-right">
                  <a 
                    href="https://github.com/shettyadithyar76-prog/tinybench" 
                    target="_blank"
                    className="flex items-center justify-end gap-2 text-sm font-semibold text-neutral-900 hover:text-black hover:underline"
                  >
                    <span>🌐 www.tinybench.org</span>
                  </a>

                  <a 
                    href="https://github.com/shettyadithyar76-prog/tinybench" 
                    target="_blank"
                    className="block text-sm font-semibold text-neutral-900 hover:text-black hover:underline"
                  >
                    @tinybenchai
                  </a>
                </div>

              </div>

              {/* Bottom Copyright & Status */}
              <div className="pt-8 border-t border-neutral-300/80 flex flex-col sm:flex-row items-center justify-between text-xs text-neutral-500 font-mono gap-4">
                <div>&copy; 2026 TinyBench. Inspired by ZEN Agency on 21st.dev.</div>
                <div className="flex items-center gap-4">
                  <span>Branch: main</span>
                  <span>&bull;</span>
                  <span className="text-emerald-700 font-bold">● Vercel Production Build</span>
                </div>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
