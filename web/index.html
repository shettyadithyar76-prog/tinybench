          { task_id: "mcq_01", category: "multiple_choice", is_correct: true, latency_seconds: 0.21, prompt: "What is the speed of light in a vacuum? A) 300,000 km/s B) 150,000 km/s", expected_answer: "A", generated_text: "A", thinking_text: "The speed of light c in vacuum is exactly 299,792,458 m/s, approximately 300,000 km/s. Choice A." },

          { task_id: "struct_05", category: "structured_output", is_correct: false, latency_seconds: 0.24, prompt: "Extract currency and amount: 'Invoice for 4800 USD'", expected_answer: "{\"amount\": 4800, \"currency\": \"USD\"}", generated_text: "USD 4800", thinking_text: "Missed JSON wrapper formatting constraint." }

        task_results: [
          { task_id: "mcq_01", category: "multiple_choice", is_correct: true, latency_seconds: 0.17, prompt: "What is the speed of light in a vacuum? A) 300,000 km/s B) 150,000 km/s", expected_answer: "A", generated_text: "A" },
          { task_id: "arith_02", category: "arithmetic_reasoning", is_correct: true, latency_seconds: 0.19, prompt: "If a machine produces 45 items in 15 minutes, how many in 2 hours?", expected_answer: "360", generated_text: "360" },
          { task_id: "fact_03", category: "factual_qa", is_correct: true, latency_seconds: 0.16, prompt: "Which element has atomic number 79?", expected_answer: "Gold", generated_text: "Gold" },

    // Sample dataset items
    const DATASET_ITEMS = [
      { task_id: "mcq_01", category: "multiple_choice", prompt: "What is the speed of light in a vacuum?\nA) 300,000 km/s\nB) 150,000 km/s\nC) 1,000,000 km/s\nD) 30,000 km/s\nAnswer with the option letter.", expected_answer: "A", scoring_method: "multiple_choice" },
      { task_id: "arith_02", category: "arithmetic_reasoning", prompt: "If a machine produces 45 items in 15 minutes, how many items does it produce in 2 hours at the same rate?", expected_answer: "360", scoring_method: "numeric" },
      { task_id: "fact_03", category: "factual_qa", prompt: "Which chemical element has the atomic number 79?", expected_answer: "Gold", scoring_method: "exact_match" },
      { task_id: "instruct_04", category: "instruction_following", prompt: "Output ONLY the JSON object {\"status\": \"ok\"} with no explanations or additional words.", expected_answer: "{\"status\": \"ok\"}", scoring_method: "compliance" },
      { task_id: "struct_05", category: "structured_output", prompt: "Extract the currency and total quantity from: 'Purchased 4 items for a total of 4800 USD'. Return JSON.", expected_answer: "{\"currency\": \"USD\", \"qty\": 4}", scoring_method: "json_schema" },
      { task_id: "mcq_06", category: "multiple_choice", prompt: "Which planet has the highest surface temperature?\nA) Mercury\nB) Venus\nC) Mars\nD) Jupiter", expected_answer: "B", scoring_method: "multiple_choice" }
    ];

    // --------------------------------------------------------------------------
    // MAIN APP COMPONENT
    // --------------------------------------------------------------------------
    function App() {
      // Theme State with localStorage persistence
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem("tinybench_web_theme");
        return saved !== null ? saved === "dark" : true;
      });

      // Navigation View State (Preserving complete functional architecture)
      const [navView, setNavView] = useState("landing"); // 'landing', 'run_benchmark', 'run_details', 'leaderboard', 'model_hub', 'dataset_explorer'
      const [runs, setRuns] = useState(SEED_RUNS);
      const [activeRunId, setActiveRunId] = useState(SEED_RUNS[0].run_id);
      const [selectedModel, setSelectedModel] = useState(VERIFIED_MODELS[0]);
      
      // Live Benchmark Execution State
      const [isBenchmarking, setIsBenchmarking] = useState(false);
      const [execProgress, setExecProgress] = useState(0);
      const [execLogs, setExecLogs] = useState([]);

      // Ollama Connection State
      const [ollamaUrl, setOllamaUrl] = useState("http://localhost:11434");
      const [ollamaStatus, setOllamaStatus] = useState("idle"); // 'idle', 'checking', 'connected', 'offline'

      // Execution Configuration State
      const [benchmarkScope, setBenchmarkScope] = useState(5); // 5, 15, 35
      const [benchmarkTemp, setBenchmarkTemp] = useState(0.0);
      const [benchmarkMaxTokens, setBenchmarkMaxTokens] = useState(384);
      const [liveHardwareTelemetry, setLiveHardwareTelemetry] = useState(null);

      // Unified Models List: Merges verified presets with laptop backend status
      const availableModelsList = useMemo(() => {
        if (!remoteModels || remoteModels.length === 0) return VERIFIED_MODELS;
        
        return VERIFIED_MODELS.map(localM => {
          const match = remoteModels.find(rm => rm.id === localM.id || rm.name === localM.name);
          if (match) {
            return {
              ...localM,
              is_installed: match.is_installed,
              is_ready: match.is_ready,
              runtime: match.runtime || localM.runtime
            };
          }
          return localM;
        });
      }, [remoteModels]);
      const [searchQuery, setSearchQuery] = useState("");
      const [scrollProgress, setScrollProgress] = useState(0);

      // Contact Form State
      const [contactForm, setContactForm] = useState({ name: '', email: '', message: '' });
      const [formSent, setFormSent] = useState(false);

      const canvasRef = useRef(null);

      // Active selected run
      const activeRun = useMemo(() => {
        return runs.find(r => r.run_id === activeRunId) || runs[0];
      }, [runs, activeRunId]);

      // Synchronize <html> theme class
      useEffect(() => {
        const root = document.documentElement;
        if (isDark) {
          root.classList.add("dark");
          root.classList.remove("light");
          localStorage.setItem("tinybench_web_theme", "dark");
        } else {
          root.classList.remove("dark");
          root.classList.add("light");
          localStorage.setItem("tinybench_web_theme", "light");
        }
      }, [isDark]);

      // Scroll Progress Indicator
      useEffect(() => {
        const handleScroll = () => {
          const total = document.documentElement.scrollHeight - window.innerHeight;
          const current = window.scrollY;
          const pct = total > 0 ? (current / total) * 100 : 0;
          setScrollProgress(pct);

          const el = document.getElementById("scroll-progress-line");
          if (el) el.style.width = `${pct}%`;
        };
        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      // Backend & Cloudflare Tunnel Connection State
      const [backendUrl, setBackendUrl] = useState(() => {
        return localStorage.getItem("tinybench_backend_url") || "http://127.0.0.1:8000";
      });
      const [backendStatus, setBackendStatus] = useState("disconnected"); // 'disconnected', 'connecting', 'connected', 'error'
      const [backendInfo, setBackendInfo] = useState(null);
      const [showBackendModal, setShowBackendModal] = useState(false);
      const [remoteModels, setRemoteModels] = useState([]);

      // Check / Connect to Local Laptop Backend via Tunnel or Direct URL
      const connectBackend = async (targetUrl = backendUrl) => {
        const cleanUrl = targetUrl.trim().replace(/\/+$/, "");
        setBackendStatus("connecting");
        try {
          const res = await fetch(`${cleanUrl}/api/health`, {
            method: "GET",
            headers: { "Content-Type": "application/json" },
            signal: AbortSignal.timeout(4000)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          setBackendInfo(data);
          setBackendStatus("connected");
          localStorage.setItem("tinybench_backend_url", cleanUrl);

          // Fetch real models and runs from laptop backend
          try {
            const mRes = await fetch(`${cleanUrl}/api/models`);
            if (mRes.ok) {
              const mData = await mRes.json();
              if (mData.models && mData.models.length > 0) {
                setRemoteModels(mData.models);
              }
            }
          } catch (_) {}

          try {
            const rRes = await fetch(`${cleanUrl}/api/runs`);
            if (rRes.ok) {
              const rData = await rRes.json();
              if (rData.runs && rData.runs.length > 0) {
                // Adapt runs from database into frontend format
                const formattedRuns = rData.runs.map(r => ({
                  run_id: r.run_id,
                  timestamp: r.timestamp.replace('T', ' ').substring(0, 19) + ' UTC',
                  model_name: r.model_metadata?.name || r.model_id || "CPU Model",
                  dataset_name: r.dataset_name || "golden_benchmark.jsonl",
                  total_examples: r.total_examples || 0,
                  accuracy: r.accuracy || 0,
                  exact_match_rate: r.exact_match_rate || 0,
                  median_latency: r.latency_summary?.median_latency_seconds || 0.15,
                  mean_latency: r.latency_summary?.mean_latency_seconds || 0.18,
                  peak_memory_mb: r.memory_measurement?.peak_rss_mb || 450,
                  is_demo: r.is_demo || false,
                  task_results: r.task_results || []
                }));
                setRuns(formattedRuns);
                if (formattedRuns.length > 0) setActiveRunId(formattedRuns[0].run_id);
              }
            }
          } catch (_) {}

        } catch (err) {
          console.error("Backend connection error:", err);
          setBackendStatus("error");
          setBackendInfo(null);
        }
      };

      // Auto-connect on startup
      useEffect(() => {
        if (backendUrl) {
          connectBackend(backendUrl);
        }
      }, []);

      // Check Ollama daemon connection
      const testOllama = async () => {
        setOllamaStatus("checking");
        try {
          const res = await fetch(`${ollamaUrl}/api/version`, { method: "GET", signal: AbortSignal.timeout(3000) });
          if (res.ok) {
            setOllamaStatus("connected");
          } else {
            setOllamaStatus("offline");
          }
        } catch (e) {
          setOllamaStatus("offline");
        }
      };

      // Execution Runner: Dispatches to Local Laptop Backend when connected, or falls back to in-browser engine
      const executeBenchmark = async () => {
        if (isBenchmarking) return;
        setIsBenchmarking(true);
        setExecProgress(0);
        setExecLogs([]);

        // If connected to local laptop backend, trigger real CPU inference!
        if (backendStatus === "connected") {
          try {
            const cleanUrl = backendUrl.trim().replace(/\/+$/, "");
            const startRes = await fetch(`${cleanUrl}/api/benchmark/start`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                model_id: selectedModel.id,
                limit: benchmarkScope,
                temperature: benchmarkTemp,
                max_tokens: benchmarkMaxTokens,
                seed: 42
              })
            });

            if (!startRes.ok) {
              const errJson = await startRes.json().catch(() => ({}));
              throw new Error(errJson.error || `HTTP ${startRes.status}`);
            }

            const startData = await startRes.json();
            const activeRunIdentifier = startData.run_id;

            // Open Server-Sent Events stream for real-time progress
            const eventSource = new EventSource(`${cleanUrl}/api/benchmark/stream`);
            
            eventSource.onmessage = (event) => {
              try {
                const parsed = JSON.parse(event.data);
                if (parsed.event === "progress") {
                  const { current, total, task, system } = parsed.data;
                  setExecProgress(Math.round((current / total) * 100));
                  setExecLogs(prev => [...prev, task]);
                  if (system) setLiveHardwareTelemetry(system);
                } else if (parsed.event === "ping") {
                  if (parsed.system) setLiveHardwareTelemetry(prev => ({ ...prev, ...parsed.system }));
                } else if (parsed.event === "completed") {
                  eventSource.close();
                  setIsBenchmarking(false);
                  setExecProgress(100);
                  
                  // Reload runs from laptop backend
                  connectBackend(cleanUrl);
                  setActiveRunId(parsed.data.run_id);
                } else if (parsed.event === "error" || parsed.event === "cancelled") {
                  eventSource.close();
                  setIsBenchmarking(false);
                  alert(`Benchmark run ${parsed.event}: ${parsed.data?.error || ''}`);
                }
              } catch (e) {
                console.error("SSE parse error", e);
              }
            };

            eventSource.onerror = (err) => {
              console.warn("SSE stream closed or error", err);
              eventSource.close();
              // Poll fallback
              const pollInterval = setInterval(async () => {
                try {
                  const statusRes = await fetch(`${cleanUrl}/api/benchmark/status`);
                  if (statusRes.ok) {
                    const st = await statusRes.json();
                    if (st.status === "completed" || st.status === "error" || st.status === "cancelled") {
                      clearInterval(pollInterval);
                      setIsBenchmarking(false);
                      setExecProgress(100);
                      connectBackend(cleanUrl);
                    } else if (st.status === "running") {
                      setExecProgress(Math.round(((st.progress || 0) / (st.total || 1)) * 100));
                      if (st.recent_results) setExecLogs(st.recent_results);
                    }
                  }
                } catch (_) {
                  clearInterval(pollInterval);
                  setIsBenchmarking(false);
                }
              }, 1000);
            };

            return;
          } catch (backendErr) {
            console.error("Laptop backend dispatch failed, falling back to in-browser execution", backendErr);
            alert(`Could not start on laptop backend: ${backendErr.message}. Running in-browser test instead.`);
          }

            const finalAcc = Number(((correctCount / total) * 100).toFixed(1));

              timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC',
              model_name: selectedModel.name,

              peak_memory_mb: selectedModel.memoryMb || 420,
              is_demo: selectedModel.id === "mock",
              task_results: generatedResults

            setRuns(prev => [newRun, ...prev]);

          };

          idx++;
          setExecProgress(Math.round((idx / total) * 100));
        }, 450);

                  <div className={`p-5 rounded-2xl border ${isDark ? 'bg-app-surfaceDark border-white/10' : 'bg-white border-[#D4DEC8]'}`}>
                    <div className="text-[10px] font-mono text-neutral-400 uppercase">Peak Memory</div>
                    <div className="text-3xl font-extrabold font-mono mt-1">{activeRun.peak_memory_mb} MB</div>
                    <div className="text-xs text-neutral-500 mt-1">Resident Set Size</div>
                  </div>
                </div>

                {/* Task by Task Audit */}
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-extrabold text-xl">Task-by-Task Audit Trail ({activeRun.task_results?.length || 0})</h3>
                    <div className="flex gap-2">
                      <button
                        onClick={() => {
                          const blob = new Blob([JSON.stringify(activeRun, null, 2)], { type: "application/json" });
                          const a = document.createElement("a");
                          a.href = URL.createObjectURL(blob);
                          a.download = `${activeRun.run_id}.json`;
                          a.click();
                        }}
                        className="px-3.5 py-1.5 rounded-lg border border-[#A3FF00]/40 text-[#A3FF00] hover:bg-[#A3FF00] hover:text-black font-mono text-xs font-bold transition-colors"
                      >
                        Download JSON Artifact
                      </button>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {activeRun.task_results?.map((task, i) => (
                      <div 
                        key={i} 
                        className={`p-5 rounded-2xl border space-y-3 transition-colors ${
                          isDark ? 'bg-app-surfaceDark border-white/10' : 'bg-white border-[#D4DEC8]'
                        }`}
                      >
                        <div className="flex items-center justify-between border-b border-white/10 pb-2">
                          <div className="flex items-center gap-3">
                            <span className="font-mono text-xs font-bold text-[#A3FF00]">{task.task_id}</span>
                            <span className="text-xs text-neutral-500 font-mono">[{task.category}]</span>
                          </div>
                          <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full font-bold ${
                            task.is_correct ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
                          }`}>
                            {task.is_correct ? "✓ PASSED" : "✗ FAILED"}
                          </span>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs font-mono">
                          <div>
                            <div className="text-neutral-500 text-[10px] uppercase mb-1">Prompt:</div>
                            <div className={`p-2.5 rounded-lg border whitespace-pre-wrap ${
                              isDark ? 'bg-neutral-900 border-neutral-800' : 'bg-neutral-50 border-neutral-200'
                            }`}>{task.prompt}</div>
                            <div className="mt-2 text-neutral-500">Expected: <strong className="text-white">{task.expected_answer}</strong></div>
                          </div>
                          <div>
                            <div className="text-neutral-500 text-[10px] uppercase mb-1">Generated Output:</div>
                            <div className={`p-2.5 rounded-lg border whitespace-pre-wrap ${
                              isDark ? 'bg-neutral-900 border-neutral-800' : 'bg-neutral-50 border-neutral-200'
                            }`}>{task.generated_text}</div>
                            {task.thinking_text && (
                              <div className="mt-2 text-neutral-400 text-[11px] bg-black/40 p-2 rounded border border-white/5">
                                🧠 CoT: {task.thinking_text}
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 4: LEADERBOARD & COMPARISON */}
            {navView === "leaderboard" && (
              <div className="max-w-7xl mx-auto px-6 py-12">
                <div className="mb-8">
                  <div className="text-xs font-mono uppercase text-[#A3FF00] tracking-widest font-bold">Evaluation Metrics</div>
                  <h1 className="text-4xl sm:text-5xl font-black tracking-tight mb-2">Cross-Model Leaderboard</h1>
                  <p className={`text-sm ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                    Verified evaluation benchmarks across open-weight models executed deterministically on CPU.
                  </p>
                </div>

                <div className={`rounded-3xl border overflow-hidden ${
                  isDark ? 'bg-app-surfaceDark border-white/10' : 'bg-white border-[#D4DEC8]'
                }`}>
                  <table className="w-full text-left text-xs font-mono">
                    <thead className={`border-b text-neutral-400 ${
                      isDark ? 'bg-neutral-900/60 border-white/10' : 'bg-neutral-100 border-[#D4DEC8]'
                    }`}>
                      <tr>
                        <th className="p-4">Rank & Model</th>
                        <th className="p-4">Developer</th>
                        <th className="p-4">Params</th>
                        <th className="p-4 text-right">Accuracy</th>
                        <th className="p-4 text-right">Exact Match</th>
                        <th className="p-4 text-right">Latency</th>
                        <th className="p-4 text-right">RAM</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/5">
                      {VERIFIED_MODELS.map((m, idx) => (
                        <tr key={m.id} className="hover:bg-white/5 transition-colors">
                          <td className="p-4 font-bold flex items-center gap-2">
                            <span className="text-[#A3FF00]">#{idx + 1}</span>
                            <span>{m.name}</span>
                          </td>
                          <td className="p-4 text-neutral-400">{m.developer}</td>
                          <td className="p-4">{m.parameters}</td>
                          <td className="p-4 text-right font-extrabold text-[#A3FF00]">{m.accuracy}%</td>
                          <td className="p-4 text-right font-bold">{m.exactMatch}%</td>
                          <td className="p-4 text-right text-neutral-300">{m.latencyMs}ms</td>
                          <td className="p-4 text-right text-neutral-400">{m.memoryMb} MB</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* VIEW 5: MODELS HUB */}
            {navView === "model_hub" && (
              <div className="max-w-7xl mx-auto px-6 py-12">
                <div className="mb-8">
                  <div className="text-xs font-mono uppercase text-[#A3FF00] tracking-widest font-bold">Catalog</div>
                  <h1 className="text-4xl sm:text-5xl font-black tracking-tight mb-2">Approved Models Hub</h1>
                  <p className={`text-sm ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                    Open-weight models verified for low-memory CPU execution with full license and memory specifications.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {VERIFIED_MODELS.map(m => (
                    <div key={m.id} className={`p-6 rounded-3xl border space-y-4 ${
                      isDark ? 'bg-app-surfaceDark border-white/10' : 'bg-white border-[#D4DEC8]'
                    }`}>
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="text-xl font-bold">{m.name}</h3>
                          <span className="text-xs font-mono text-neutral-400">by {m.developer} • {m.license}</span>
                        </div>
                        <span className="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-[#A3FF00] text-black font-bold">{m.runtime}</span>
                      </div>
                      <p className={`text-xs leading-relaxed ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>{m.description}</p>
                      <div className="grid grid-cols-3 gap-2 text-xs font-mono text-center">
                        <div className={`p-2.5 rounded-xl border ${isDark ? 'bg-neutral-900 border-neutral-800' : 'bg-neutral-50 border-neutral-200'}`}>
                          <span className="text-neutral-500 block text-[10px]">MIN RAM</span>
                          <span className="font-bold text-[#A3FF00]">{m.minRamMb} MB</span>
                        </div>
                        <div className={`p-2.5 rounded-xl border ${isDark ? 'bg-neutral-900 border-neutral-800' : 'bg-neutral-50 border-neutral-200'}`}>
                          <span className="text-neutral-500 block text-[10px]">REC RAM</span>
                          <span className="font-bold">{m.recRamMb} MB</span>
                        </div>
                        <div className={`p-2.5 rounded-xl border ${isDark ? 'bg-neutral-900 border-neutral-800' : 'bg-neutral-50 border-neutral-200'}`}>
                          <span className="text-neutral-500 block text-[10px]">SIZE</span>
                          <span className="font-bold">{m.downloadSize}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 6: DATASET EXPLORER */}
            {navView === "dataset_explorer" && (
              <div className="max-w-7xl mx-auto px-6 py-12">
                <div className="mb-8">
                  <div className="text-xs font-mono uppercase text-[#A3FF00] tracking-widest font-bold">Suite</div>
                  <h1 className="text-4xl sm:text-5xl font-black tracking-tight mb-2">basic_v1.jsonl Dataset Explorer</h1>
                  <p className={`text-sm ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                    Inspect the deterministic evaluation items spanning multiple-choice, arithmetic reasoning, and instruction following.
                  </p>
                </div>

                <div className="space-y-4">
                  {DATASET_ITEMS.map((item, i) => (
                    <div key={item.task_id} className={`p-5 rounded-2xl border space-y-2 ${
                      isDark ? 'bg-app-surfaceDark border-white/10' : 'bg-white border-[#D4DEC8]'
                    }`}>
                      <div className="flex items-center justify-between border-b border-white/10 pb-2">
                        <div className="flex items-center gap-2">
                          <span className="font-mono text-xs font-bold text-[#A3FF00]">{item.task_id}</span>
                          <span className="text-xs text-neutral-400 font-mono">[{item.category}]</span>
                        </div>
                        <span className="text-xs font-mono text-neutral-500">Method: {item.scoring_method}</span>
                      </div>
                      <div className="text-xs font-mono whitespace-pre-wrap">{item.prompt}</div>
                      <div className="text-xs font-mono text-[#A3FF00] pt-1">Expected: {item.expected_answer}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* ==================================================================
              FOOTER
              ================================================================== */}
          <footer className={`border-t py-14 transition-colors ${
            isDark ? 'bg-black border-white/10 text-neutral-400' : 'bg-white border-[#D4DEC8] text-neutral-600'
          }`}>
            <div className="max-w-7xl mx-auto px-6">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 mb-10">
                <div className="space-y-2">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-[#A3FF00] flex items-center justify-center text-black font-black text-lg shadow-[0_0_12px_rgba(163,255,0,0.4)]">
                      ⚡
                    </div>
                    <div>
                      <div className="font-black text-xl tracking-tight text-[#A3FF00]">TINYBENCH</div>
                      <div className="text-xs font-mono text-neutral-500">Open-Weight CPU Benchmarking</div>
                    </div>
                  </div>
                  <p className="text-xs max-w-sm">
                    Reproducible local language model benchmarking engineered for commodity hardware and edge deployments.
                  </p>
                </div>

                {/* Laptop Backend & Tunnel Hub Button */}
                <div className="flex flex-wrap items-center gap-4 text-xs font-mono">
                  <button 
                    onClick={() => setShowBackendModal(true)}
                    className="px-4 py-2 rounded-xl bg-[#A3FF00] text-black font-extrabold flex items-center gap-1.5 shadow-sm hover:scale-105 transition-transform"
                  >
                    <span>⚡ Connect Laptop Backend</span>
                    <span>↗</span>
                  </button>

                  <a 
                    href="https://github.com/shettyadithyar76-prog/tinybench" 
                    target="_blank" 
                    rel="noreferrer"
                    className={`px-4 py-2 rounded-xl border transition-colors ${
                      isDark ? 'border-white/15 text-white hover:border-[#A3FF00]' : 'border-neutral-300 text-black hover:border-black'
                    }`}
                  >
                    GitHub Repository
                  </a>
                </div>
              </div>

              <div className="pt-8 border-t border-white/5 flex flex-col sm:flex-row justify-between text-xs font-mono text-neutral-500 gap-2">
                <div>&copy; 2026 TinyBench. Inspired by ZEN Agency on 21st.dev.</div>
                <div>Production Build &bull; Active Theme: {isDark ? "Dark Slate" : "Light Porcelain"}</div>
              </div>
            </div>
          </footer>

          {/* ==================================================================
              LAPTOP BACKEND & CLOUDFLARE TUNNEL MODAL
              ================================================================== */}
          {showBackendModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className={`w-full max-w-xl rounded-3xl border p-6 sm:p-8 space-y-6 ${
                isDark ? 'bg-neutral-950 border-white/15 text-white' : 'bg-white border-[#D4DEC8] text-black'
              }`}>
                <div className="flex items-center justify-between pb-4 border-b border-white/10">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-[#A3FF00] flex items-center justify-center text-black font-black text-lg">
                      ⚡
                    </div>
                    <div>
                      <h3 className="text-xl font-black">Laptop Backend & Tunnel Hub</h3>
                      <p className="text-xs font-mono text-neutral-400">Direct Local CPU Execution</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setShowBackendModal(false)}
                    className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-mono uppercase font-bold text-neutral-400 mb-2">
                      Cloudflare Tunnel URL or Local URL
                    </label>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={backendUrl}
                        onChange={e => setBackendUrl(e.target.value)}
                        placeholder="https://your-tunnel.trycloudflare.com or http://127.0.0.1:8000"
                        className={`flex-1 px-4 py-3 text-xs font-mono rounded-xl border outline-none ${
                          isDark ? 'bg-black border-neutral-800 text-white' : 'bg-neutral-50 border-neutral-300 text-black'
                        }`}
                      />
                      <button
                        onClick={() => connectBackend(backendUrl)}
                        className="px-5 py-3 rounded-xl bg-[#A3FF00] hover:bg-[#B5FF26] text-black font-bold text-xs uppercase"
                      >
                        {backendStatus === "connecting" ? "Checking..." : "Connect"}
                      </button>
                    </div>
                    <p className="text-[11px] font-mono text-neutral-400 mt-2">
                      💡 Run <code className="text-[#A3FF00] bg-black/40 px-1 py-0.5 rounded">python scripts/serve.py</code> or double-click <code className="text-[#A3FF00] bg-black/40 px-1 py-0.5 rounded">start_backend.bat</code> on your laptop. Copy the generated <code className="text-[#A3FF00]">https://*.trycloudflare.com</code> link here.
                    </p>
                  </div>

                  {/* Backend Telemetry Card */}
                  {backendInfo?.system ? (
                    <div className={`p-4 rounded-2xl border space-y-3 ${
                      isDark ? 'bg-neutral-900/80 border-white/10' : 'bg-[#F2F7EE] border-[#D4DEC8]'
                    }`}>
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono uppercase font-bold text-emerald-400">● Connected Hardware</span>
                        <span className="text-xs font-mono text-neutral-400">{backendInfo.system.os_version}</span>
                      </div>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 text-xs font-mono">
                        <div className="p-2 rounded-lg bg-black/40 border border-white/5">
                          <span className="text-neutral-500 block text-[10px]">CPU</span>
                          <span className="font-bold truncate block">{backendInfo.system.cpu_name}</span>
                        </div>
                        <div className="p-2 rounded-lg bg-black/40 border border-white/5">
                          <span className="text-neutral-500 block text-[10px]">CORES</span>
                          <span className="font-bold text-[#A3FF00]">{backendInfo.system.cpu_count_logical} Logical</span>
                        </div>
                        <div className="p-2 rounded-lg bg-black/40 border border-white/5">
                          <span className="text-neutral-500 block text-[10px]">TOTAL RAM</span>
                          <span className="font-bold text-[#A3FF00]">{backendInfo.system.total_ram_gb} GB</span>
                        </div>
                        <div className="p-2 rounded-lg bg-black/40 border border-white/5">
                          <span className="text-neutral-500 block text-[10px]">AVAIL RAM</span>
                          <span className="font-bold">{backendInfo.system.available_ram_gb} GB</span>
                        </div>
                        <div className="p-2 rounded-lg bg-black/40 border border-white/5">
                          <span className="text-neutral-500 block text-[10px]">OLLAMA</span>
                          <span className={`font-bold ${backendInfo.ollama?.available ? 'text-emerald-400' : 'text-neutral-500'}`}>
                            {backendInfo.ollama?.available ? `v${backendInfo.ollama.version}` : 'Not Running'}
                          </span>
                        </div>
                        <div className="p-2 rounded-lg bg-black/40 border border-white/5">
                          <span className="text-neutral-500 block text-[10px]">STATUS</span>
                          <span className="font-bold text-emerald-400">Ready</span>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="p-4 rounded-2xl border border-dashed border-white/10 text-center py-6">
                      <p className="text-xs font-mono text-neutral-400">
                        {backendStatus === "error" 
                          ? "❌ Could not reach backend server at that URL. Ensure 'python scripts/serve.py' is running on your laptop."
                          : "No laptop backend connected yet. Benchmarks will run in browser demo mode until connected."}
                      </p>
                    </div>
                  )}
                </div>

                <div className="flex justify-end gap-3 pt-4 border-t border-white/10">
                  <button
                    onClick={() => setShowBackendModal(false)}
                    className="px-6 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-mono font-bold"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
