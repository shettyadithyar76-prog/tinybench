    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem("tinybench_theme") || "dark");
      const [nav, setNav] = useState("overview");
      
      // Ollama Connection State
      const [ollamaUrl, setOllamaUrl] = useState(() => localStorage.getItem("tinybench_ollama_url") || "http://localhost:11434");
      const [ollamaStatus, setOllamaStatus] = useState({ state: "checking", version: "", models: [], latency: 0, error: "" });
      const [showEndpointModal, setShowEndpointModal] = useState(false);
      
      // Benchmark Studio State
      const [selectedModelId, setSelectedModelId] = useState(MODEL_CATALOGUE[3].id); // Gemma 4 default
      const [scopePreset, setScopePreset] = useState("Quick Test (5 tasks)");
      const [customLimit, setCustomLimit] = useState(5);
      const [selectedCategories, setSelectedCategories] = useState(["multiple_choice", "factual_qa", "numeric_reasoning"]);
      const [maxTokens, setMaxTokens] = useState(384);
      const [temperature, setTemperature] = useState(0.0);
      const [seed, setSeed] = useState(42);

      // Runner Live Execution State
      const [runState, setRunState] = useState("idle"); // idle, running, completed, error, cancelled
      const [runProgress, setRunProgress] = useState({ current: 0, total: 0, currentTask: null, elapsed: 0, latency: 0 });
      const abortControllerRef = useRef(null);

      // Persisted Runs & Active Run Inspector
      const [runs, setRuns] = useState(() => {
        try {
          const stored = localStorage.getItem("tinybench_runs");
          return stored ? JSON.parse(stored) : SEED_RUNS;
        } catch {
          return SEED_RUNS;
        }
      });
      const [activeRunId, setActiveRunId] = useState(() => SEED_RUNS[0]?.run_id || "");

      // Dataset Items
      const [datasetItems, setDatasetItems] = useState([]);
      const [datasetLoading, setDatasetLoading] = useState(true);

      // Load Dataset from web/data/basic_v1.json
      useEffect(() => {
        fetch('/data/basic_v1.json')
          .then(r => r.json())
          .then(data => {
            setDatasetItems(data);
            setDatasetLoading(false);
          })
          .catch(() => {
            // Fallback: extract sample tasks
            setDatasetItems(SEED_RUNS[0].task_results.map(t => ({
              task_id: t.task_id,
              category: t.category,
              prompt: t.prompt,
              expected_answer: t.expected_answer,
              scoring_method: t.category === "multiple_choice" ? "multiple_choice" : "exact_match",
              metadata: { options: ["A", "B", "C", "D"] },
              description: "Standard bundled test task"
            })));
            setDatasetLoading(false);
          });
      }, []);

      // Synchronize Theme
      useEffect(() => {
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        }
        localStorage.setItem("tinybench_theme", theme);
      }, [theme]);

      // Save Runs to LocalStorage
      useEffect(() => {
        localStorage.setItem("tinybench_runs", JSON.stringify(runs));
      }, [runs]);

      // Ping Ollama Endpoint
      const checkOllamaConnection = async (urlToTest = ollamaUrl) => {
        setOllamaStatus(prev => ({ ...prev, state: "checking", error: "" }));
        const cleanUrl = (urlToTest || "").trim().replace(/\/+$/, "");
        const t0 = performance.now();
        try {
          const verRes = await fetch(`${cleanUrl}/api/version`, { method: "GET", signal: AbortSignal.timeout(3500) });
          if (!verRes.ok) throw new Error(`HTTP ${verRes.status}`);
          const verData = await verRes.json();
          const latency = Math.round(performance.now() - t0);

          // Check installed models
          let installedModels = [];
          try {
            const tagsRes = await fetch(`${cleanUrl}/api/tags`, { method: "GET", signal: AbortSignal.timeout(3500) });
            if (tagsRes.ok) {
              const tagsData = await tagsRes.json();
              installedModels = (tagsData.models || []).map(m => m.name);
            }
          } catch {}

          setOllamaStatus({
            state: "online",
            version: verData.version || "0.40+",
            models: installedModels,
            latency,
            error: ""
          });
          localStorage.setItem("tinybench_ollama_url", cleanUrl);
        } catch (err) {
          setOllamaStatus({
            state: "offline",
            version: "",
            models: [],
            latency: 0,
            error: err.message || "Failed to reach endpoint"
          });
        }
      };

      // Initial ping on mount
      useEffect(() => {
        checkOllamaConnection();
      }, []);

      // Selected Model Object
      const activeModel = useMemo(() => {
        return MODEL_CATALOGUE.find(m => m.id === selectedModelId) || MODEL_CATALOGUE[0];
      }, [selectedModelId]);

      // Filtered Tasks for Run Details
      const activeRun = useMemo(() => {
        return runs.find(r => r.run_id === activeRunId) || runs[0];
      }, [runs, activeRunId]);

      // Extract MCQ choice helper (matching python accuracy.py)
      const extractMcqChoice = (text, validOpts = ["A", "B", "C", "D"]) => {
        if (!text) return null;
        const clean = text.trim();
        const validSet = new Set(validOpts.map(o => o.toUpperCase()));
        
        // 1. First token match
        const firstToken = clean.split(/\s+/)[0]?.replace(/[).,;:!]/g, "").toUpperCase();
        if (validSet.has(firstToken)) return firstToken;

        // 2. Answer: [A-D] regex
        const match = clean.match(/(?:answer|option|choice|conclusion|is)\s*[:=\-]?\s*\(?([A-Da-d])\)?(?:\.|\b|$)/i);
        if (match && validSet.has(match[1].toUpperCase())) return match[1].toUpperCase();

        // 3. Standalone letter
        const matchStandalone = clean.match(/\b([A-Da-d])\b/);
        if (matchStandalone && validSet.has(matchStandalone[1].toUpperCase())) return matchStandalone[1].toUpperCase();

        return null;
      };

      // Launch Benchmark Execution Pipeline
      const launchBenchmark = async () => {
        if (activeModel.runtime === "transformers_cpu") {
          alert(`Notice: '${activeModel.name}' runs on Hugging Face Transformers CPU. In browser mode, use the local CLI command: 'tinybench evaluate --model ${activeModel.id}' or launch via Streamlit Cloud.`);
          return;
        }

        if (ollamaStatus.state !== "online") {
          setShowEndpointModal(true);
          return;
        }

        // Determine effective task limit
        let targetLimit = 5;
        if (scopePreset === "Standard Run (15 tasks)") targetLimit = 15;
        else if (scopePreset === "Full Dataset (All 35 tasks)") targetLimit = datasetItems.length;
        else if (scopePreset === "Custom Limit") targetLimit = Math.max(1, customLimit);

        // Filter dataset by categories
        const candidateTasks = datasetItems.filter(item => selectedCategories.includes(item.category)).slice(0, targetLimit);
        if (candidateTasks.length === 0) {
          alert("No benchmark tasks match your category filters.");
          return;
        }

        setRunState("running");
        abortControllerRef.current = new AbortController();
        const runId = `run_${Date.now()}_${activeModel.id.replace(/[:/]/g, "_")}`;
        const startTime = Date.now();
        const taskResults = [];
        const latencies = [];

        for (let i = 0; i < candidateTasks.length; i++) {
          if (abortControllerRef.current?.signal.aborted) break;
          const task = candidateTasks[i];
          setRunProgress({
            current: i + 1,
            total: candidateTasks.length,
            currentTask: task,
            elapsed: Math.round((Date.now() - startTime) / 1000),
            latency: 0
          });

          const t0 = performance.now();
          let generatedText = "";
          let thinkingText = "";
          let isCorrect = false;
          let exactMatch = false;
          let error = null;

          try {
            const payload = {
              model: activeModel.id,
              prompt: task.prompt,
              stream: false,
              options: {
                num_predict: Math.max(maxTokens, 384),
                temperature: temperature,
                seed: seed
              }
            };

            const resp = await fetch(`${ollamaUrl}/api/generate`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              signal: abortControllerRef.current.signal
            });

            if (!resp.ok) throw new Error(`Ollama returned status ${resp.status}`);
            const data = await resp.json();
            const latencySec = (performance.now() - t0) / 1000;
            latencies.push(latencySec);

            let rawResp = (data.response || "").trim();
            let rawThink = (data.thinking || "").trim();

            // Sanitize unclosed think tags
            let cleanAnswer = rawResp.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
            cleanAnswer = cleanAnswer.replace(/^<think>\s*/i, "").trim();
            let effectiveText = cleanAnswer || rawResp;

            // Fallback if response empty but thinking exists
            if (!effectiveText && rawThink) {
              const mcqMatch = rawThink.match(/(?:answer|option|choice|conclusion|is)\s*[:=\-]?\s*\(?([A-Da-d])\)?(?:\.|\b|$)/i);
              if (mcqMatch) effectiveText = mcqMatch[1].toUpperCase();
              else {
                const lines = rawThink.split("\n").map(l => l.trim()).filter(Boolean);
                effectiveText = lines[lines.length - 1] || "";
              }
            }

            generatedText = effectiveText;
            thinkingText = rawThink;

            // Grade answer
            const exp = String(task.expected_answer).trim();
            if (task.scoring_method === "multiple_choice") {
              const choice = extractMcqChoice(generatedText);
              isCorrect = choice ? choice.toUpperCase() === exp.toUpperCase() : false;
              exactMatch = generatedText.toUpperCase() === exp.toUpperCase();
            } else {
              exactMatch = generatedText.toLowerCase().replace(/[.,!]/g, "").trim() === exp.toLowerCase().replace(/[.,!]/g, "").trim();
              isCorrect = exactMatch;
            }

            taskResults.push({
              task_id: task.task_id,
              category: task.category,
              prompt: task.prompt,
              expected_answer: task.expected_answer,
              generated_text: generatedText,
              thinking_text: thinkingText,
              is_correct: isCorrect,
              exact_match: exactMatch,
              compliance_score: 1.0,
              latency_seconds: Number(latencySec.toFixed(3)),
              prompt_tokens: data.prompt_eval_count || 30,
              generated_tokens: data.eval_count || 150,
              error: null
            });
          } catch (err) {
            if (abortControllerRef.current?.signal.aborted) break;
            error = err.message || "Inference error";
            taskResults.push({
              task_id: task.task_id,
              category: task.category,
              prompt: task.prompt,

              thinking_text: "",
              is_correct: false,
              exact_match: false,
              compliance_score: 0.0,
              latency_seconds: 0.0,
              error: error
            });
          }
        }

        if (abortControllerRef.current?.signal.aborted) {
          setRunState("cancelled");
          return;
        }

        // Aggregate Run Result
        const correctCount = taskResults.filter(t => t.is_correct).length;
        const totalCount = taskResults.length;
        const accuracy = totalCount > 0 ? Number(((correctCount / totalCount) * 100).toFixed(1)) : 0;

                            <span className="font-bold text-cyan-400">{item.task_id}</span>
                            <span className="px-2 py-0.5 rounded bg-surface text-textMuted uppercase border border-borderSubtle text-[10px]">
                              {item.category} &bull; {item.scoring_method}
                            </span>
                          </div>
                          <div className="text-xs text-textPrimary whitespace-pre-wrap font-mono">{item.prompt}</div>
                          <div className="text-xs text-textMuted font-mono">
                            Expected: <span className="font-bold text-emerald-400">{item.expected_answer}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* Ollama Connection Modal */}
          {showEndpointModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="clay-card max-w-lg w-full p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-borderSubtle pb-3">
                  <h3 className="font-bold text-sm text-textPrimary flex items-center gap-2">
                    <span>🔌</span> Ollama Runtime & Tunnel Endpoint Configuration
                  </h3>
                  <button onClick={() => setShowEndpointModal(false)} className="text-textMuted hover:text-textPrimary text-sm font-bold">✕</button>
                </div>

                <p className="text-xs text-textMuted leading-relaxed">
                  Enter your local Ollama address or your secure Cloudflare Tunnel endpoint. For browser access to local Ollama, ensure your daemon is started with CORS enabled:
                </p>

                <div className="bg-nested p-2.5 rounded-lg border border-borderSubtle font-mono text-xs text-cyan-400">
                  OLLAMA_ORIGINS="*" ollama serve
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-textMuted mb-1.5">
                    Endpoint URL:
                  </label>
                  <input
                    type="text"
                    value={ollamaUrl}
                    onChange={e => setOllamaUrl(e.target.value)}
                    placeholder="http://localhost:11434 or https://tunnel.trycloudflare.com"
                    className="w-full px-3 py-2 rounded-lg bg-nested border border-borderSubtle text-xs font-mono text-textPrimary focus:outline-none focus:border-cyan-400"
                  />
                </div>

                <div className="flex items-center justify-between pt-2">
                  <button
                    onClick={() => checkOllamaConnection(ollamaUrl)}
                    className="px-4 py-2 rounded-lg text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-colors"
                  >
                    Test Connection
                  </button>
                  <span className={`text-xs font-mono font-bold ${ollamaStatus.state === 'online' ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {ollamaStatus.state === 'online' ? `✓ Online (${ollamaStatus.latency}ms)` : ollamaStatus.error || "Disconnected"}
                  </span>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-borderSubtle px-6 py-6 text-center text-xs text-textMuted font-mono">
            <p>TinyBench &copy; 2026. Built for honest, deterministic CPU AI benchmarking. Zero synthetic data.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
