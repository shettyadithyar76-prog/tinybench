[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinybench"
version = "0.1.0"
description = "A lightweight open-weight LLM benchmarking toolkit for CPU-only laptops"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "TinyBench Contributors" }
]
keywords = ["llm", "benchmark", "nlp", "evaluation", "transformers", "pytorch", "cpu", "hacktoberfest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
models = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
]
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
all = [
    "tinybench[models,dashboard,dev]"
]

[project.scripts]
tinybench = "tinybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests requiring external model downloads",
]
